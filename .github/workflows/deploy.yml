name: Veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  api:
    name: API (Cloudflare Worker)
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
    steps:
      - name: Prüfen, ob alle Secrets eingetragen sind
        run: |
          missing=""
          [ -z "$CLOUDFLARE_API_TOKEN" ] && missing="$missing CLOUDFLARE_API_TOKEN"
          [ -z "$CLOUDFLARE_ACCOUNT_ID" ] && missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -z "$ADMIN_PASSWORD" ] && missing="$missing ADMIN_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Diese GitHub-Secrets fehlen noch:$missing. Siehe README, Schritt 2."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Abhängigkeiten installieren
        working-directory: worker
        run: npm ci

      - name: Datenbank anlegen (nur beim ersten Mal)
        run: node scripts/ensure-d1.mjs

      - name: Datenbank auf den neuesten Stand bringen
        working-directory: worker
        run: npx wrangler d1 migrations apply wichteln --remote

      - name: Worker veröffentlichen
        id: deploy
        working-directory: worker
        run: |
          npx wrangler deploy 2>&1 | tee deploy.log
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -n 1)
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Admin-Passwort hinterlegen
        working-directory: worker
        run: printf '%s' "$ADMIN_PASSWORD" | npx wrangler secret put ADMIN_PASSWORD

  site:
    name: Webseite (GitHub Pages)
    needs: api
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: API-Adresse eintragen
        env:
          WORKER_URL: ${{ needs.api.outputs.url }}
          API_URL: ${{ vars.API_URL }}
        run: |
          url="${API_URL:-$WORKER_URL}"
          if [ -z "$url" ]; then
            echo "::error::Die Adresse des Workers wurde nicht gefunden. Trag sie als Repository-Variable API_URL ein (README, Abschnitt Probleme)."
            exit 1
          fi
          echo "window.WICHTEL_API = '$url';" > site/config.js
          echo "API: $url"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Auf GitHub Pages veröffentlichen
        id: pages
        uses: actions/deploy-pages@v4
