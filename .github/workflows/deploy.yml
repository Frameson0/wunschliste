name: Veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  api:
    name: API (Cloudflare Worker)
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
      AMAZONSCRAPER_KEY: ${{ secrets.AMAZONSCRAPER_KEY }}
    steps:
      - name: Prüfen, ob alle Secrets eingetragen sind
        run: |
          missing=""
          [ -z "$CLOUDFLARE_API_TOKEN" ] && missing="$missing CLOUDFLARE_API_TOKEN"
          [ -z "$CLOUDFLARE_ACCOUNT_ID" ] && missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -z "$ADMIN_PASSWORD" ] && missing="$missing ADMIN_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Diese GitHub-Secrets fehlen noch:$missing. Siehe README, Schritt 2."
            exit 1
          fi

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Abhängigkeiten installieren
        working-directory: worker
        run: npm ci

      - name: Datenbank anlegen (nur falls noch keine eingetragen ist)
        run: |
          if grep -q '00000000-0000-0000-0000-000000000000' worker/wrangler.toml; then
            node scripts/ensure-d1.mjs
          else
            echo "Datenbank ist bereits in wrangler.toml eingetragen."
          fi

      - name: Datenbank auf den neuesten Stand bringen
        working-directory: worker
        # Braucht die Token-Berechtigung "D1 · Edit". Fehlt sie, läuft der Rest trotzdem weiter.
        continue-on-error: true
        run: npx wrangler d1 migrations apply wichteln --remote

      - name: Worker veröffentlichen
        id: deploy
        working-directory: worker
        run: |
          set +e
          npx wrangler deploy > deploy.log 2>&1
          code=$?
          set -e
          cat deploy.log
          if [ "$code" -ne 0 ] && grep -qiE "workers\.dev subdomain|register a workers\.dev" deploy.log; then
            echo "::error::Dein Cloudflare-Konto hat noch keine workers.dev-Subdomain. Öffne im Cloudflare-Dashboard 'Workers & Pages', richte die Subdomain ein (ein Name genügt) und starte den Workflow neu."
            exit 1
          fi
          if [ "$code" -ne 0 ]; then
            msg=$(grep -E "ERROR|✘" deploy.log | head -n 3 | tr '\n' ' ')
            echo "::error::Veröffentlichen des Workers fehlgeschlagen: ${msg:-siehe Log}"
            exit "$code"
          fi
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -n 1 || true)
          if [ -z "$url" ]; then
            echo "Keine Adresse in der Ausgabe gefunden – frage die workers.dev-Subdomain bei Cloudflare ab."
            sub=$(curl -fsS "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
                    -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | jq -r '.result.subdomain // empty' || true)
            if [ -n "$sub" ]; then
              url="https://wichteln-api.$sub.workers.dev"
              # workers.dev für diesen Worker sicher einschalten
              curl -fsS -X POST "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/wichteln-api/subdomain" \
                -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" \
                --data '{"enabled":true,"previews_enabled":false}' > /dev/null || true
            else
              echo "::error::Dein Cloudflare-Konto hat noch keine workers.dev-Subdomain. Öffne im Cloudflare-Dashboard 'Workers & Pages', richte die Subdomain ein (ein Name genügt) und starte den Workflow neu."
              exit 1
            fi
          fi
          echo "Worker-Adresse: $url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Admin-Passwort hinterlegen
        working-directory: worker
        run: printf '%s' "$ADMIN_PASSWORD" | npx wrangler secret put ADMIN_PASSWORD

      - name: Schlüssel für die Amazon-Suche hinterlegen (falls eingetragen)
        working-directory: worker
        run: |
          if [ -n "$SERPAPI_KEY" ]; then printf '%s' "$SERPAPI_KEY" | npx wrangler secret put SERPAPI_KEY; else echo "SERPAPI_KEY ist nicht gesetzt."; fi
          if [ -n "$AMAZONSCRAPER_KEY" ]; then printf '%s' "$AMAZONSCRAPER_KEY" | npx wrangler secret put AMAZONSCRAPER_KEY; else echo "AMAZONSCRAPER_KEY ist nicht gesetzt."; fi

  site:
    name: Webseite (GitHub Pages)
    needs: api
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: API-Adresse eintragen
        env:
          WORKER_URL: ${{ needs.api.outputs.url }}
          API_URL: ${{ vars.API_URL }}
        run: |
          # Fallback: bekannte Adresse des Workers
          url="${API_URL:-${WORKER_URL:-https://wichteln-api.jeric-kebel.workers.dev}}"
          if [ -z "$url" ]; then
            echo "::error::Die Adresse des Workers wurde nicht gefunden. Trag sie als Repository-Variable API_URL ein (README, Abschnitt Probleme)."
            exit 1
          fi
          echo "window.WICHTEL_API = '$url';" > site/config.js
          echo "API: $url"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Auf GitHub Pages veröffentlichen
        id: pages
        uses: actions/deploy-pages@v4
