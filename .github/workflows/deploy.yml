name: Veröffentlichen

# Branch "main" = echte Seite, Branch "test" = Testversion unter /test/ (nur mit Admin-Passwort).
# Jeder Push baut beide, damit GitHub Pages immer beide Fassungen enthält.
on:
  push:
    branches: [main, test]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  api:
    name: API ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: live
            ref: main
            env_flag: ''
            script: wichteln-api
            db: wichteln
          - label: test
            ref: test
            env_flag: '--env test'
            script: wichteln-api-test
            db: wichteln-test
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
      AMAZONSCRAPER_KEY: ${{ secrets.AMAZONSCRAPER_KEY }}
    steps:
      - name: Prüfen, ob alle Secrets eingetragen sind
        run: |
          missing=""
          [ -z "$CLOUDFLARE_API_TOKEN" ] && missing="$missing CLOUDFLARE_API_TOKEN"
          [ -z "$CLOUDFLARE_ACCOUNT_ID" ] && missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -z "$ADMIN_PASSWORD" ] && missing="$missing ADMIN_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Diese GitHub-Secrets fehlen noch:$missing. Siehe README, Schritt 2."
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          ref: ${{ matrix.ref }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Abhängigkeiten installieren
        working-directory: worker
        run: npm ci

      - name: Datenbank auf den neuesten Stand bringen
        working-directory: worker
        # Braucht die Token-Berechtigung "D1 · Edit". Fehlt sie, läuft der Rest trotzdem weiter.
        continue-on-error: true
        run: npx wrangler d1 migrations apply ${{ matrix.db }} --remote ${{ matrix.env_flag }}

      - name: Worker veröffentlichen
        working-directory: worker
        run: |
          set +e
          npx wrangler deploy ${{ matrix.env_flag }} > deploy.log 2>&1
          code=$?
          set -e
          cat deploy.log
          if [ "$code" -ne 0 ]; then
            msg=$(grep -E "ERROR|✘" deploy.log | head -n 3 | tr '\n' ' ')
            echo "::error::Veröffentlichen des Workers fehlgeschlagen: ${msg:-siehe Log}"
            exit "$code"
          fi
          # workers.dev-Adresse für diesen Worker sicher einschalten
          curl -fsS -X POST "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/${{ matrix.script }}/subdomain" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" \
            --data '{"enabled":true,"previews_enabled":false}' > /dev/null || true

      - name: Admin-Passwort hinterlegen
        working-directory: worker
        run: printf '%s' "$ADMIN_PASSWORD" | npx wrangler secret put ADMIN_PASSWORD ${{ matrix.env_flag }}

      - name: Schlüssel für die Amazon-Suche hinterlegen (falls eingetragen)
        working-directory: worker
        run: |
          if [ -n "$SERPAPI_KEY" ]; then printf '%s' "$SERPAPI_KEY" | npx wrangler secret put SERPAPI_KEY ${{ matrix.env_flag }}; else echo "SERPAPI_KEY ist nicht gesetzt."; fi
          if [ -n "$AMAZONSCRAPER_KEY" ]; then printf '%s' "$AMAZONSCRAPER_KEY" | npx wrangler secret put AMAZONSCRAPER_KEY ${{ matrix.env_flag }}; else echo "AMAZONSCRAPER_KEY ist nicht gesetzt."; fi

  # GitHub Pages darf nur von "main" aus veröffentlichen. Ein Push auf "test" stößt deshalb
  # einen Lauf auf "main" an, der beide Fassungen der Seite neu baut.
  pages-anstossen:
    name: Webseite über main neu bauen
    needs: api
    if: ${{ !cancelled() && github.ref == 'refs/heads/test' }}
    runs-on: ubuntu-latest
    steps:
      - run: gh workflow run deploy.yml --ref main -R "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}

  site:
    name: Webseite (GitHub Pages)
    needs: api
    # Auch veröffentlichen, wenn nur die Testversion der API gehakt hat
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          path: live

      - uses: actions/checkout@v5
        with:
          ref: test
          path: test

      - name: Seiten zusammenbauen
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          url="${API_URL:-https://wichteln-api.jeric-kebel.workers.dev}"
          test_url="${url/wichteln-api./wichteln-api-test.}"
          mkdir -p _site
          cp -r live/site/. _site/
          echo "window.WICHTEL_API = '$url';" > _site/config.js
          v="$(git -C live rev-parse --short HEAD)"
          sed -i "s/?v=dev/?v=$v/g" _site/index.html
          sed -i "s/wichteln-v2/wichteln-$v/" _site/sw.js

          mkdir -p _site/test
          cp -r test/site/. _site/test/
          rm -f _site/test/sw.js
          printf "window.WICHTEL_API = '%s';\nwindow.WICHTEL_TEST = true;\n" "$test_url" > _site/test/config.js
          tv="t$(git -C test rev-parse --short HEAD)"
          sed -i "s/?v=dev/?v=$tv/g" _site/test/index.html
          # Testversion nicht als App installierbar machen und nicht in Suchmaschinen
          sed -i 's#<link rel="manifest" href="manifest.webmanifest">#<meta name="robots" content="noindex">#' _site/test/index.html
          echo "Live: $url  ·  Test: $test_url"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Auf GitHub Pages veröffentlichen
        id: pages
        uses: actions/deploy-pages@v4
